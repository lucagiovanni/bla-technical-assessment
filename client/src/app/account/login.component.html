<section class="account">
  <div class="card">
    <p class="eyebrow">Your tasks</p>
    <h2>Sign in</h2>
    <p class="lede">Open the list that belongs to you.</p>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        Email
        <input type="email" formControlName="email" autocomplete="username" required />
      </label>
      <label>
        Password
        <input type="password" formControlName="password" autocomplete="current-password" required />
      </label>
      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }
      <button class="primary" type="submit" [disabled]="submitting()">Sign in</button>
    </form>
    <p class="switch">New here? <a routerLink="/register">Create an account</a></p>
  </div>
</section>
