<section class="account">
  <div class="card">
    <p class="eyebrow">Your tasks</p>
    <h2>Create an account</h2>
    <p class="lede">Register, then come back to a list only you can change.</p>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        Email
        <input type="email" formControlName="email" autocomplete="username" required />
      </label>
      <label>
        Password
        <input type="password" formControlName="password" autocomplete="new-password" required />
        <span class="hint">At least 8 characters, with a letter and a digit.</span>
      </label>
      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }
      <button class="primary" type="submit" [disabled]="submitting()">Create account</button>
    </form>
    <p class="switch">Already registered? <a routerLink="/login">Sign in</a></p>
  </div>
</section>
