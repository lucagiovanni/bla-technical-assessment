<header class="topbar">
  <a class="brand" routerLink="/tasks">
    <span class="mark" aria-hidden="true"></span>
    Task Manager
  </a>
  <nav>
    @if (auth.isLoggedIn()) {
      <span class="who">{{ auth.user()?.email }}</span>
      <button type="button" (click)="signOut()">Sign out</button>
    } @else {
      <a routerLink="/login">Sign in</a>
      <a class="nav-primary" routerLink="/register">Create account</a>
    }
  </nav>
</header>
<main>
  <router-outlet />
</main>
